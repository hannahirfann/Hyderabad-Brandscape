<style>
  :root { --navy:#222A68; --gold:#D9A441; --cream:#FDF6E3; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--cream);
    font-family:'Josefin Sans',sans-serif;
    color: var(--navy);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:40px 20px 60px;
  }
  h1 {
    font-family:'Playfair Display',serif; font-weight:700; font-size:1.9rem;
    text-align:center; margin-bottom:8px;
  }
  .sub {
    font-size:0.8rem; font-weight:300; color: rgba(34,42,104,0.65);
    text-align:center; max-width:520px; line-height:1.6; margin-bottom:10px;
  }
  #remoteStatus {
    display:flex; align-items:center; gap:6px; margin-bottom:20px;
    font-size:0.6rem; letter-spacing:0.15em; text-transform:uppercase; color:rgba(34,42,104,0.45);
  }
  #remoteDot { width:7px; height:7px; border-radius:50%; background:#c9583f; transition:background 0.3s ease; }

  .compare-frame {
    width:100%; max-width:1200px; aspect-ratio: 1200/517;
    border-radius:20px; overflow:hidden;
    box-shadow:0 30px 70px rgba(34,42,104,0.3);
    position:relative;
    touch-action: none;
    cursor: ew-resize;
  }
  .compare-frame img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    display:block; user-select:none; -webkit-user-drag:none;
  }
  #imgTop { clip-path: inset(0 50% 0 0); }

  .era-tag {
    position:absolute; top:16px; z-index:5; pointer-events:none;
    font-size:0.62rem; letter-spacing:0.22em; text-transform:uppercase;
    padding:7px 14px; border-radius:999px; backdrop-filter: blur(6px);
    background: rgba(0,0,0,0.4); color:#fff; border: 1px solid rgba(255,255,255,0.25);
  }
  .era-tag.today { left:16px; }
  .era-tag.future { right:16px; }

  .divider-line {
    position:absolute; top:0; bottom:0; left:50%; width:2px;
    background: #fff; box-shadow: 0 0 8px rgba(0,0,0,0.5);
    z-index:6; pointer-events:none; margin-left:-1px;
  }
  .divider-handle {
    position:absolute; top:50%; left:50%; width:46px; height:46px;
    margin:-23px 0 0 -23px; border-radius:50%;
    background:#fff; box-shadow:0 4px 14px rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
    z-index:7; cursor:ew-resize;
  }
  .divider-handle svg { width:20px; height:20px; }

  /* pins — only meaningful on the revealed FUTURE side */
  .pin {
    position:absolute; z-index:8;
    width:22px; height:22px; margin:-11px 0 0 -11px;
    border-radius:50%;
    background: var(--gold); border:2.5px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,0.4);
    cursor:pointer;
    opacity:0; transform:scale(0.6);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .pin.visible { opacity:1; transform:scale(1); }
  .pin::after {
    content:''; position:absolute; inset:0; border-radius:50%;
    animation: pinPulse 2s ease-in-out infinite;
    box-shadow: 0 0 0 0 rgba(217,164,65,0.6);
  }
  @keyframes pinPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(217,164,65,0.5); }
    50% { box-shadow: 0 0 0 8px rgba(217,164,65,0); }
  }

  .pin-card {
    position:absolute; z-index:9; width:260px;
    background:#10142c; border:1px solid rgba(217,164,65,0.35);
    border-radius:14px; padding:14px 16px;
    box-shadow:0 16px 40px rgba(0,0,0,0.5);
    opacity:0; transform:translateY(6px); pointer-events:none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .pin-card.show { opacity:1; transform:translateY(0); pointer-events:auto; }
  .pin-card .pc-title { font-family:'Playfair Display',serif; font-weight:700; font-size:0.95rem; color:#fff; margin-bottom:8px; }
  .pin-card .pc-list { list-style:none; display:flex; flex-direction:column; gap:6px; }
  .pin-card .pc-list li {
    position:relative; padding-left:14px;
    font-size:0.7rem; line-height:1.5; color:rgba(253,246,227,0.82); font-weight:300;
  }
  .pin-card .pc-list li::before {
    content:''; position:absolute; left:0; top:6px; width:5px; height:5px; border-radius:50%;
    background: var(--gold);
  }

  @media (max-width: 640px) {
    .pin-card { width:180px; font-size:0.9em; }
  }
</style>

<script>
const PINS = [
  {
    x: 16, y: 42, title: 'MNC & Corporate Campuses',
    points: [
      'Amazon operates one of its largest India campuses in the Financial District',
      "Google and Microsoft have established major office presences in the same corridor",
      'Growth here follows CURE\'s services-only, Net Zero mandate — office towers built to sustainability targets, not manufacturing'
    ]
  },
  {
    x: 40, y: 30, title: 'T-Hub 2.0',
    points: [
      "A larger footprint for Asia's largest startup incubator",
      "Anchors the innovation economy named in Telangana Rising's Knowledge Hub strategy",
      'Designed around shared R&D space and offshore university campuses'
    ]
  },
  {
    x: 62, y: 20, title: 'CURE Core Business District',
    points: [
      'Dense commercial core inside the 160km ORR',
      'Services-sector only — manufacturing excluded to protect air quality and liveability',
      'Net Zero commitment embedded in every new building here'
    ]
  },
  {
    x: 88, y: 40, title: 'Premium Residential Towers',
    points: [
      'Prestige Group alone has multiple large-scale residential projects underway in this corridor',
      'High-rise housing following the same growth curve already visible in the Financial District today',
      'Sustainability-linked design: green certifications increasingly standard for new towers here'
    ]
  }
];

const frame = document.getElementById('compareFrame');
const imgTop = document.getElementById('imgTop');
const dividerLine = document.getElementById('dividerLine');
const dividerHandle = document.getElementById('dividerHandle');
const pinsLayer = document.getElementById('pinsLayer');

let value = 50; // 0-100, position of the divider
let dragging = false;

function buildPins() {
  PINS.forEach((p, i) => {
    const pin = document.createElement('div');
    pin.className = 'pin';
    pin.id = 'pin' + i;
    pin.style.left = p.x + '%';
    pin.style.top = p.y + '%';
    pin.addEventListener('pointerdown', (e) => e.stopPropagation());
    pin.addEventListener('click', (e) => { e.stopPropagation(); toggleCard(i); });
    pinsLayer.appendChild(pin);

    const card = document.createElement('div');
    card.className = 'pin-card';
    card.id = 'card' + i;
    card.innerHTML = `<div class="pc-title">${p.title}</div><ul class="pc-list">${p.points.map(pt => `<li>${pt}</li>`).join('')}</ul>`;
    card.addEventListener('pointerdown', (e) => e.stopPropagation());
    const cardLeft = Math.min(Math.max(p.x, 14), 78);
    card.style.left = cardLeft + '%';
    card.style.top = (p.y + 6) + '%';
    pinsLayer.appendChild(card);
  });
}
buildPins();

function toggleCard(i) {
  document.querySelectorAll('.pin-card').forEach((c, ci) => {
    c.classList.toggle('show', ci === i && !c.classList.contains('show'));
  });
}

function applyValue() {
  imgTop.style.clipPath = `inset(0 ${100 - value}% 0 0)`;
  dividerLine.style.left = value + '%';
  dividerHandle.style.left = value + '%';

  PINS.forEach((p, i) => {
    const visible = p.x > value;
    document.getElementById('pin' + i).classList.toggle('visible', visible);
    if (!visible) document.getElementById('card' + i).classList.remove('show');
  });
}
applyValue();

function setFromClientX(clientX) {
  const rect = frame.getBoundingClientRect();
  value = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
  applyValue();
}

frame.addEventListener('pointerdown', (e) => {
  dragging = true;
  frame.setPointerCapture(e.pointerId);
  setFromClientX(e.clientX);
});
frame.addEventListener('pointermove', (e) => { if (dragging) setFromClientX(e.clientX); });
frame.addEventListener('pointerup', () => { dragging = false; });
frame.addEventListener('pointercancel', () => { dragging = false; });

// ---------- Remote control receiver ----------
const TOPIC_BASE = 'hyd-experience-remote';
const remoteDot = document.getElementById('remoteDot');
const remoteStatusText = document.getElementById('remoteStatusText');

const remoteClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
  clientId: 'skyline-' + Math.random().toString(16).slice(2)
});
remoteClient.on('connect', () => {
  remoteDot.style.background = '#3fae6a';
  remoteStatusText.textContent = 'Remote: connected · ' + TOPIC_BASE;
  remoteClient.subscribe(TOPIC_BASE + '/remote');
});
remoteClient.on('error', () => { remoteStatusText.textContent = 'Remote: connection error'; });
remoteClient.on('close', () => {
  remoteDot.style.background = '#c9583f';
  remoteStatusText.textContent = 'Remote: disconnected';
});

remoteClient.on('message', (topic, payloadBuf) => {
  let msg;
  try { msg = JSON.parse(payloadBuf.toString()); } catch (e) { return; }

  // SLIDER — the phone's linear slider maps directly onto the divider position
  if (msg.action === 'slider') {
    value = msg.value;
    applyValue();
  }

  // DIAL — also supported, same direct 0-100 mapping
  if (msg.action === 'dial') {
    value = msg.value;
    applyValue();
  }

  // NAV — nudges the divider in steps
  if (msg.action === 'nav') {
    value = Math.max(0, Math.min(100, value + (msg.dir === 'prev' ? -10 : 10)));
    applyValue();
  }

  // RESET — back to the 50/50 starting position
  if (msg.action === 'reset') {
    value = 50;
    applyValue();
    document.querySelectorAll('.pin-card').forEach(c => c.classList.remove('show'));
  }
});
</script>

</body>
</html>
