<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Do We Need More Of?</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #222A68; --accent: #14275C; --yellow: #FEDD79; --cream: #FDF6E3;
    --green: #6FA26E; --blue: #5B9BD5; --gold: #D9A441;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--cream);
    font-family:'Josefin Sans',sans-serif;
    color: var(--navy);
    min-height: 100vh;
    display:flex; flex-direction:column; align-items:center;
    padding: 40px 20px 60px;
  }
  .tag {
    font-size:0.62rem; letter-spacing:0.32em; text-transform:uppercase;
    color: rgba(34,42,104,0.5); margin-bottom:10px;
  }
  h1 {
    font-family:'Playfair Display',serif; font-weight:600; font-size:1.9rem;
    text-align:center; margin-bottom:8px;
  }
  .sub {
    font-size:0.8rem; font-weight:300; color: rgba(34,42,104,0.65);
    text-align:center; max-width:520px; line-height:1.6; margin-bottom:30px;
  }

  .stage {
    display:flex; gap:24px; width:100%; max-width:980px; align-items:flex-start;
  }

  .map-wrap {
    flex:1; min-width:0; position:relative;
  }
  .map-box {
    position:relative;
    width:100%;
    aspect-ratio: 1360 / 1400;
    border-radius:20px;
    overflow:hidden;
    box-shadow: 0 24px 60px rgba(34,42,104,0.28);
    background:#fff;
    touch-action: none;
  }
  .map-box img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    pointer-events:none; user-select:none; -webkit-user-drag:none;
  }
  .map-box.drop-hover::after {
    content:''; position:absolute; inset:0; background: rgba(254,221,121,0.18);
    border: 2px dashed rgba(34,42,104,0.35); border-radius:20px; pointer-events:none;
  }

  .pin {
    position:absolute; width:26px; height:26px; margin:-13px 0 0 -13px;
    border-radius:50%; border:2.5px solid #fff;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    animation: pinDrop 0.25s cubic-bezier(.34,1.56,.64,1);
    z-index: 5;
  }
  .pin svg { width:13px; height:13px; }
  @keyframes pinDrop {
    0% { transform: scale(0) translateY(-14px); opacity:0; }
    70% { transform: scale(1.15) translateY(0); opacity:1; }
    100% { transform: scale(1) translateY(0); }
  }
  .pin::after {
    content:'×'; position:absolute; top:-9px; right:-9px; width:16px; height:16px;
    background:var(--navy); color:#fff; border-radius:50%; font-size:11px;
    display:none; align-items:center; justify-content:center; line-height:1;
  }
  .pin:hover::after { display:flex; }

  .side {
    width: 200px; flex-shrink:0;
    display:flex; flex-direction:column; gap:14px;
  }
  .tally-box {
    background:#fff; border-radius:16px; padding:16px 18px;
    box-shadow: 0 8px 24px rgba(34,42,104,0.12);
  }
  .tally-title {
    font-size:0.58rem; letter-spacing:0.2em; text-transform:uppercase;
    color: rgba(34,42,104,0.5); margin-bottom:12px;
  }
  .tally-row {
    display:flex; align-items:center; gap:8px; font-size:0.72rem;
    margin-bottom:9px;
  }
  .tally-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .tally-label { flex:1; color: rgba(34,42,104,0.8); }
  .tally-count { font-weight:600; color: var(--navy); }
  .reset-btn {
    background:transparent; border:1px solid rgba(34,42,104,0.25); color:var(--navy);
    border-radius:999px; padding:10px 0; font-size:0.62rem; letter-spacing:0.15em;
    text-transform:uppercase; cursor:pointer; width:100%;
  }
  .reset-btn:hover { background: rgba(34,42,104,0.06); }

  .chips-row {
    width:100%; max-width:980px; margin-top:26px;
    display:flex; justify-content:center; gap:22px; flex-wrap:wrap;
  }
  .chip {
    display:flex; flex-direction:column; align-items:center; gap:9px;
    cursor:grab; touch-action:none; user-select:none;
  }
  .chip:active { cursor:grabbing; }
  .chip-circle {
    width:86px; height:86px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 26px rgba(34,42,104,0.25);
    border:2.5px solid #fff;
    transition: transform 0.15s ease;
  }
  .chip:hover .chip-circle { transform: scale(1.06); }
  .chip-circle svg { width:34px; height:34px; }
  .chip-label {
    font-size:0.64rem; letter-spacing:0.06em; text-align:center; max-width:100px;
    color: var(--navy); line-height:1.35;
  }

  .drag-ghost {
    position:fixed; width:76px; height:76px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:999; opacity:0.92;
    box-shadow: 0 14px 34px rgba(0,0,0,0.35);
    border:2.5px solid #fff;
  }
  .drag-ghost svg { width:30px; height:30px; }

  .hint {
    font-size:0.62rem; color: rgba(34,42,104,0.4); text-align:center;
    margin-top:22px; max-width:520px; line-height:1.6;
  }

  @media (max-width: 720px) {
    .stage { flex-direction:column; }
    .side { width:100%; flex-direction:row; flex-wrap:wrap; }
    .tally-box { flex:1; min-width:220px; }
  }
</style>
</head>
<body>

    </div>
  </div>
  <div class="side">
    <div class="tally-box">
      <div class="tally-title">Votes so far</div>
      <div id="tallyList"></div>
    </div>
    <button class="reset-btn" id="resetBtn" type="button">Clear all pins</button>
  </div>
</div>

<div class="chips-row" id="chipsRow"></div>

<script>
const CATEGORIES = [
  {
    id: 'metro', label: 'Metro', color: '#222A68',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="3"/><path d="M4 11h16"/><circle cx="8" cy="19" r="1.2" fill="#fff" stroke="none"/><circle cx="16" cy="19" r="1.2" fill="#fff" stroke="none"/><path d="M2 21.5h20"/></svg>'
  },
  {
    id: 'shadedpaths', label: 'Shaded Footpaths', color: '#4C7A4B',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a8 8 0 0116 0"/><path d="M4 10v3M20 10v3"/><path d="M3 20h18"/><path d="M8 20l3-6M16 20l-3-6"/></svg>'
  },
  {
    id: 'thirdspaces', label: 'Third Spaces — parks, cafes, plazas', color: '#C68A2E',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11a2 2 0 012-2h1"/><path d="M20 20V11a2 2 0 00-2-2h-1"/><path d="M9 9V6a3 3 0 016 0v3"/><path d="M2 20h20"/><path d="M9 20v-4h6v4"/></svg>'
  },
  {
    id: 'drainage', label: 'Drainage', color: '#3E7EA8',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="10" rx="2"/><path d="M7 7v10M11 7v10M15 7v10"/><path d="M12 2v3M12 19v3"/></svg>'
  }
];

const chipsRow = document.getElementById('chipsRow');
const mapBox = document.getElementById('mapBox');
const tallyList = document.getElementById('tallyList');
const resetBtn = document.getElementById('resetBtn');

let counts = {};
CATEGORIES.forEach(c => counts[c.id] = 0);

function renderTally() {
  tallyList.innerHTML = '';
  CATEGORIES.forEach(c => {
    const row = document.createElement('div');
    row.className = 'tally-row';
    row.innerHTML = `<span class="tally-dot" style="background:${c.color}"></span>
      <span class="tally-label">${c.label.split(' — ')[0]}</span>
      <span class="tally-count">${counts[c.id]}</span>`;
    tallyList.appendChild(row);
  });
}
renderTally();

CATEGORIES.forEach(cat => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.dataset.cat = cat.id;
  chip.innerHTML = `
    <div class="chip-circle" style="background:${cat.color}">${cat.icon}</div>
    <div class="chip-label">${cat.label}</div>
  `;
  chipsRow.appendChild(chip);
});

let ghost = null;
let dragCat = null;

function startDrag(catId, clientX, clientY) {
  dragCat = CATEGORIES.find(c => c.id === catId);
  ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.style.background = dragCat.color;
  ghost.innerHTML = dragCat.icon;
  document.body.appendChild(ghost);
  moveGhost(clientX, clientY);
}
function moveGhost(clientX, clientY) {
  if (!ghost) return;
  ghost.style.left = (clientX - 38) + 'px';
  ghost.style.top = (clientY - 38) + 'px';
  const rect = mapBox.getBoundingClientRect();
  const over = clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom;
  mapBox.classList.toggle('drop-hover', over);
}
function endDrag(clientX, clientY) {
  if (!ghost || !dragCat) return;
  const rect = mapBox.getBoundingClientRect();
  const over = clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom;
  if (over) {
    const xPct = ((clientX - rect.left) / rect.width) * 100;
    const yPct = ((clientY - rect.top) / rect.height) * 100;
    placePin(dragCat, xPct, yPct);
  }
  mapBox.classList.remove('drop-hover');
  ghost.remove();
  ghost = null;
  dragCat = null;
}

function placePin(cat, xPct, yPct) {
  const pin = document.createElement('div');
  pin.className = 'pin';
  pin.style.left = xPct + '%';
  pin.style.top = yPct + '%';
  pin.style.background = cat.color;
  pin.innerHTML = cat.icon;
  pin.title = cat.label;
  pin.addEventListener('click', () => {
    pin.remove();
    counts[cat.id] = Math.max(0, counts[cat.id] - 1);
    renderTally();
  });
  mapBox.appendChild(pin);
  counts[cat.id]++;
  renderTally();
}

chipsRow.addEventListener('pointerdown', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  e.preventDefault();
  startDrag(chip.dataset.cat, e.clientX, e.clientY);
  chip.setPointerCapture && chip.setPointerCapture(e.pointerId);
});
window.addEventListener('pointermove', (e) => {
  if (ghost) moveGhost(e.clientX, e.clientY);
});
window.addEventListener('pointerup', (e) => {
  if (ghost) endDrag(e.clientX, e.clientY);
});
window.addEventListener('pointercancel', () => {
  if (ghost) { ghost.remove(); ghost = null; dragCat = null; mapBox.classList.remove('drop-hover'); }
});

resetBtn.addEventListener('click', () => {
  mapBox.querySelectorAll('.pin').forEach(p => p.remove());
  CATEGORIES.forEach(c => counts[c.id] = 0);
  renderTally();
});
</script>

</html>
