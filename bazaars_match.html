<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazaars of Hyderabad</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --navy:#222A68; --gold:#D9A441; --cream:#FDF6E3; --green:#4C8A50; --red:#C9583F; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--cream);
    font-family:'Josefin Sans',sans-serif;
    color: var(--navy);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:40px 20px 60px;
  }
  h1 {
    font-family:'Playfair Display',serif; font-weight:700; font-size:1.9rem;
    text-align:center; margin-bottom:8px;
  }
  .sub {
    font-size:0.8rem; font-weight:300; color: rgba(34,42,104,0.65);
    text-align:center; max-width:540px; line-height:1.6; margin-bottom:10px;
  }
  .progress {
    font-size:0.62rem; letter-spacing:0.2em; text-transform:uppercase; color: var(--gold);
    margin-bottom:24px; font-weight:600;
  }

  .screen-frame {
    width:100%; max-width:1080px;
    border-radius:26px; overflow:hidden;
    box-shadow:0 30px 70px rgba(34,42,104,0.3);
    position:relative;
    background: radial-gradient(140% 120% at 50% 0%, #24356e 0%, #131c3f 55%, #0b1130 100%);
    padding: 34px clamp(16px,3vw,40px) 30px;
    color:#fff;
  }

  /* 8-card grid */
  .card-grid {
    display:grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
    margin-bottom: 26px;
  }
  @media (max-width: 720px) { .card-grid { grid-template-columns: repeat(2, 1fr); } }

  .market-card {
    background: rgba(255,255,255,0.03);
    border: 1.5px dashed rgba(253,246,227,0.2);
    border-radius: 14px;
    padding: 10px;
    display:flex; flex-direction:column; gap:7px;
    transition: all 0.25s ease;
  }
  .market-card.over { border-color: var(--gold); background: rgba(217,164,65,0.08); }
  .market-card.matched { border-style:solid; border-color: var(--green); }
  .market-card.wrong-flash { border-color: var(--red); background: rgba(201,88,63,0.12); }

  .mc-name {
    font-family:'Playfair Display',serif; font-weight:700; font-size:0.78rem;
    text-align:center; line-height:1.2;
  }
  .mc-img {
    height: 96px; border-radius:9px;
    background: rgba(255,255,255,0.03);
    border: 1px dashed rgba(253,246,227,0.15);
    display:flex; align-items:center; justify-content:center;
    overflow: hidden;
    position: relative;
  }
  .mc-img img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; transition: opacity 0.35s ease;
  }
  .mc-img img.show { opacity:1; }
  .mc-img svg.show { opacity:1; }
  .mc-famous {
    min-height: 30px;
    font-size:0.6rem; letter-spacing:0.02em; text-align:center; line-height:1.3;
    display:flex; align-items:center; justify-content:center;
    color: var(--gold); font-weight:600;
  }
  .mc-actions { display:flex; gap:8px; justify-content:center; }
  .mc-btn {
    position: relative;
    width:30px; height:30px; border-radius:50%;
    border:1.5px solid rgba(160,190,255,0.55);
    background: rgba(160,190,255,0.08);
    color: rgba(210,225,255,0.9);
    display:flex; align-items:center; justify-content:center;
    cursor: default;
  }
  .mc-btn svg { width:15px; height:15px; }
  .mc-btn::after {
    content: attr(data-label);
    position: absolute; bottom: 130%; left:50%; transform:translateX(-50%);
    background: #10142c; border:1px solid rgba(217,164,65,0.35);
    color: #fff; font-size:0.52rem; letter-spacing:0.03em; text-transform:uppercase;
    padding: 4px 8px; border-radius:6px; white-space:nowrap;
    opacity:0; pointer-events:none; transition: opacity 0.15s ease;
  }
  .mc-btn:hover::after { opacity:1; }

  /* drag tray at the bottom */
  .tray-label {
    font-size:0.58rem; letter-spacing:0.2em; text-transform:uppercase;
    color: rgba(217,164,65,0.7); margin-bottom:10px; text-align:center;
  }
  .tray {
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
  }
  .chip {
    padding:9px 13px; border-radius:8px; text-align:center;
    background: radial-gradient(circle at 35% 30%, #3a4a8c, #171f42 75%);
    border: 1.5px solid rgba(111,160,240,0.35);
    font-size:0.66rem;
    cursor: grab; touch-action: none; user-select:none;
    transition: opacity 0.25s ease;
  }
  .chip:active { cursor: grabbing; }
  .chip.matched { opacity: 0.2; cursor: default; pointer-events: none; text-decoration: line-through; }
  .chip.dragging-source { opacity: 0.3; }

  .drag-ghost {
    position: fixed; z-index: 999; pointer-events:none;
    padding:9px 13px; border-radius:8px;
    background: var(--gold); color: var(--navy); font-weight:600; font-size:0.66rem;
    box-shadow: 0 10px 26px rgba(0,0,0,0.4);
    transform: translate(-50%,-50%);
  }
</style>
</head>

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const cardGrid = document.getElementById('cardGrid');
const tray = document.getElementById('tray');
const progressEl = document.getElementById('progress');
let matchedCount = 0;

MARKETS.forEach(m => {
  const card = document.createElement('div');
  card.className = 'market-card';
  card.dataset.id = m.id;
  card.innerHTML = `
    <div class="mc-name">${m.name}</div>
    <div class="mc-img" id="img-${m.id}"><img src="${m.img}" alt="${m.name}"></div>
    <div class="mc-famous" id="famous-${m.id}"></div>
    <div class="mc-actions">
      <button class="mc-btn" type="button" data-label="Know the History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      </button>
      <button class="mc-btn" type="button" data-label="Find Directions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-11.5A7 7 0 0119 9.5C19 14.5 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg>
      </button>
    </div>
  `;
  cardGrid.appendChild(card);
});

shuffle(MARKETS).forEach(m => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = m.famousFor;
  chip.dataset.id = m.id;
  tray.appendChild(chip);
});

let ghost = null;
let dragChip = null;

function startDrag(chipEl, clientX, clientY) {
  dragChip = chipEl;
  chipEl.classList.add('dragging-source');
  ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.textContent = chipEl.textContent;
  document.body.appendChild(ghost);
  moveGhost(clientX, clientY);
}
function moveGhost(clientX, clientY) {
  if (!ghost) return;
  ghost.style.left = clientX + 'px';
  ghost.style.top = clientY + 'px';
  document.querySelectorAll('.market-card').forEach(c => {
    const r = c.getBoundingClientRect();
    const over = clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom;
    c.classList.toggle('over', over && !c.classList.contains('matched'));
  });
}
function endDrag(clientX, clientY) {
  if (!ghost || !dragChip) return;
  let landedCard = null;
  document.querySelectorAll('.market-card').forEach(c => {
    const r = c.getBoundingClientRect();
    if (clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) landedCard = c;
    c.classList.remove('over');
  });

  if (landedCard && !landedCard.classList.contains('matched')) {
    if (landedCard.dataset.id === dragChip.dataset.id) {
      landedCard.classList.add('matched');
      dragChip.classList.remove('dragging-source');
      dragChip.classList.add('matched');
      document.getElementById('famous-' + landedCard.dataset.id).textContent = dragChip.textContent;
      document.querySelector('#img-' + landedCard.dataset.id + ' img').classList.add('show');
      matchedCount++;
      progressEl.textContent = matchedCount + ' / 8 matched';
    } else {
      landedCard.classList.add('wrong-flash');
      setTimeout(() => landedCard.classList.remove('wrong-flash'), 400);
      dragChip.classList.remove('dragging-source');
    }
  } else {
    dragChip.classList.remove('dragging-source');
  }

  ghost.remove();
  ghost = null;
  dragChip = null;
}

tray.addEventListener('pointerdown', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip || chip.classList.contains('matched')) return;
  e.preventDefault();
  startDrag(chip, e.clientX, e.clientY);
});
window.addEventListener('pointermove', (e) => { if (ghost) moveGhost(e.clientX, e.clientY); });
window.addEventListener('pointerup', (e) => { if (ghost) endDrag(e.clientX, e.clientY); });
window.addEventListener('pointercancel', () => {
  if (ghost) { ghost.remove(); ghost = null; }
  if (dragChip) { dragChip.classList.remove('dragging-source'); dragChip = null; }
});
</script>
