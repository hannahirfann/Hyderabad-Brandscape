<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Expansion of Hyderabad</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.15.2/mqtt.min.js"></script>
<style>
  :root { --navy:#222A68; --gold:#D9A441; --cream:#FDF6E3; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--cream);
    font-family:'Josefin Sans',sans-serif;
    color: var(--navy);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:40px 20px 60px;
  }
  h1 {
    font-family:'Playfair Display',serif; font-weight:600; font-size:1.85rem;
    text-align:center; margin-bottom:8px;
  }
  .sub {
    font-size:0.8rem; font-weight:300; color: rgba(34,42,104,0.65);
    text-align:center; max-width:480px; line-height:1.6; margin-bottom:28px;
  }

  .stage {
    width:100%; max-width:820px;
    background: radial-gradient(140% 120% at 50% 0%, #24356e 0%, #131c3f 55%, #0b1130 100%);
    border-radius:26px; box-shadow:0 30px 70px rgba(34,42,104,0.3);
    padding: 44px clamp(20px,5vw,50px) 34px;
    display:flex; flex-direction:column; align-items:center;
    color:#fff;
  }

  /* ---------- BIG CONTENT ---------- */
  .content-year {
    font-family:'Playfair Display',serif; font-weight:700; font-size:clamp(3rem,9vw,4.6rem);
    line-height:1; letter-spacing:0.01em;
  }
  .content-area {
    font-size:0.85rem; color: var(--gold); margin-top:6px; letter-spacing:0.04em;
  }
  .map-placeholder {
    width:100%; max-width:340px; aspect-ratio:248/303; margin-top:22px;
    border-radius:16px;
    background: rgba(255,255,255,0.03);
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:10px;
  }
  .map-placeholder img { max-width:100%; max-height:100%; object-fit:contain; }
  .map-placeholder span {
    font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase;
    color: rgba(217,164,65,0.65); line-height:1.6;
  }
  .content-desc {
    font-size:0.82rem; line-height:1.65; color: rgba(255,255,255,0.85); font-weight:300;
    margin-top:16px; max-width:440px; text-align:center;
  }

  /* ---------- DRAGGABLE ROTATING DIAL ---------- */
  .dial-outer {
    width:150px; height:150px; margin-top:32px; position:relative; flex-shrink:0;
  }
  .dial-indicator {
    position:absolute; top:-4px; left:50%; width:0; height:0; margin-left:-5px;
    border-left:5px solid transparent; border-right:5px solid transparent;
    border-top:8px solid var(--gold); z-index:3;
  }
  .dial-ring {
    width:100%; height:100%; border-radius:50%; position:relative;
    background: radial-gradient(circle at 35% 30%, #1b2246, #0c1128 75%);
    border:1px solid rgba(111,160,240,0.25);
    cursor: grab; touch-action:none;
  }
  .dial-ring.dragging { cursor: grabbing; }
  .dial-hub {
    position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px;
    border-radius:50%; background: rgba(111,160,240,0.4); z-index:2;
  }
  .yr-btn {
    position:absolute; width:40px; height:40px; margin:-20px 0 0 -20px;
    border-radius:50%; border:1.5px solid rgba(111,160,240,0.35);
    background: #131a38;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .yr-btn span {
    font-size:0.56rem; font-weight:600; color: rgba(255,255,255,0.8);
    transition: color 0.2s ease;
  }
  .yr-btn.active {
    background: var(--gold); border-color: var(--gold);
  }
  .yr-btn.active span { color: var(--navy); }

  @media (max-width: 520px) {
    .dial-outer { width:126px; height:126px; }
    .yr-btn { width:36px; height:36px; margin:-18px 0 0 -18px; }
    .yr-btn span { font-size:0.5rem; }
  }

  /* ---------- ZIGZAG GROWTH STRIP ---------- */
  .growth-strip {
    width:100%; max-width:1000px; margin-top:34px;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding: 0 10px;
  }
  .growth-item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .growth-item img { display:block; }
  .growth-item .gy {
    font-size:0.62rem; letter-spacing:0.08em; color: rgba(34,42,104,0.55);
  }
  .growth-item:nth-child(odd) { margin-bottom: 0; }
  .growth-item:nth-child(even) { margin-bottom: 34px; }
  .growth-item { cursor:pointer; }
  .growth-item img { border-radius:4px; transition: filter 0.2s ease, transform 0.2s ease; filter: saturate(0.7) brightness(0.9); }
  .growth-item.current img { filter: none; transform: translateY(-3px); }
  .growth-item.current .gy { color: var(--navy); font-weight:600; }
</style>
</head>
<body>

<h1>Urban Expansion of Hyderabad</h1>
<div class="sub">Press a year to see how far the city had grown by then.</div>
<div id="remoteStatus" style="display:flex;align-items:center;gap:6px;margin-bottom:12px;font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(34,42,104,0.45);">
  <span id="remoteDot" style="width:7px;height:7px;border-radius:50%;background:#c9583f;transition:background 0.3s ease;"></span>
  <span id="remoteStatusText">Remote: connecting…</span>
</div>

<div class="stage">
  <div class="content-year" id="cYear">1650</div>
  <div class="content-area" id="cArea"></div>
  <div class="map-placeholder" id="cMap"><span>Map placeholder</span></div>
  <div class="content-desc" id="cDesc"></div>

  <div class="dial-outer">
    <div class="dial-indicator"></div>
    <div class="dial-ring" id="dialRing">
      <div class="dial-hub"></div>
    </div>
  </div>
</div>

<div class="growth-strip" id="growthStrip"></div>

const dialRing = document.getElementById('dialRing');
const cYear = document.getElementById('cYear');
const cArea = document.getElementById('cArea');
const cMap = document.getElementById('cMap');
const cDesc = document.getElementById('cDesc');

const RADIUS = 57;
const N = ERAS.length;
const STEP = 360 / N;
const buttons = [];

ERAS.forEach((era, i) => {
  const baseAngle = STEP * i - 90; // position around the ring, before any rotation
  const rad = baseAngle * Math.PI / 180;
  const x = 75 + RADIUS * Math.cos(rad);
  const y = 75 + RADIUS * Math.sin(rad);

  const btn = document.createElement('div');
  btn.className = 'yr-btn';
  btn.dataset.base = baseAngle;
  btn.style.left = x + 'px';
  btn.style.top = y + 'px';
  btn.innerHTML = `<span>${era.year}</span>`;
  btn.addEventListener('click', () => { if (!wasDrag) snapTo(i); });
  dialRing.appendChild(btn);
  buttons.push(btn);
});

let rotation = 0;       // current ring rotation in degrees
let dragging = false;
let wasDrag = false;
let startPointerAngle = 0;
let startRotation = 0;
let activeIdx = 0;

function pointerAngle(clientX, clientY) {
  const rect = dialRing.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  return Math.atan2(clientY - cy, clientX - cx) * 180 / Math.PI;
}

function applyRotation(r) {
  rotation = r;
  dialRing.style.transform = `rotate(${r}deg)`;
  // counter-rotate each button's label so text always stays upright
  buttons.forEach(b => { b.querySelector('span').style.transform = `rotate(${-r}deg)`; });
  updateNearest();
}

function updateNearest() {
  // indicator sits at -90deg (top); find which button's current angle is closest to it
  let best = 0, bestDist = Infinity;
  buttons.forEach((b, i) => {
    const eff = (parseFloat(b.dataset.base) + rotation) % 360;
    let dist = Math.abs(((eff - (-90) + 540) % 360) - 180);
    if (dist < bestDist) { bestDist = dist; best = i; }
  });
  if (best !== activeIdx) {
    activeIdx = best;
    showEra(activeIdx);
  }
  buttons.forEach((b, i) => b.classList.toggle('active', i === activeIdx));
}

function snapTo(idx) {
  // rotate so that button idx lands exactly on the indicator, via the shortest path
  const base = parseFloat(buttons[idx].dataset.base);
  let target = -90 - base;
  target = target % 360;
  let delta = ((target - rotation + 540) % 360) - 180;
  animateTo(rotation + delta);
}

function animateTo(target) {
  dialRing.style.transition = 'transform 0.4s cubic-bezier(.3,.8,.4,1)';
  buttons.forEach(b => b.querySelector('span').style.transition = 'transform 0.4s cubic-bezier(.3,.8,.4,1)');
  applyRotation(target);
  setTimeout(() => {
    dialRing.style.transition = '';
    buttons.forEach(b => b.querySelector('span').style.transition = '');
  }, 400);
}

dialRing.addEventListener('pointerdown', (e) => {
  dragging = true; wasDrag = false;
  dialRing.classList.add('dragging');
  dialRing.style.transition = '';
  startPointerAngle = pointerAngle(e.clientX, e.clientY);
  startRotation = rotation;
  dialRing.setPointerCapture(e.pointerId);
});
dialRing.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const now = pointerAngle(e.clientX, e.clientY);
  const delta = now - startPointerAngle;
  if (Math.abs(delta) > 2) wasDrag = true;
  applyRotation(startRotation + delta);
});
dialRing.addEventListener('pointerup', () => {
  dragging = false;
  dialRing.classList.remove('dragging');
  snapTo(activeIdx);
});

function showEra(idx) {
  const era = ERAS[idx];
  cYear.textContent = era.year;
  cArea.textContent = era.area;
  cMap.innerHTML = `<img src="${era.img}" alt="Hyderabad, ${era.year}">`;
  cDesc.textContent = era.desc;
  document.querySelectorAll('.growth-item').forEach((g, i) => g.classList.toggle('current', i === idx));
}

// zigzag growth overview strip: size increases left to right, vertical position alternates
const growthStrip = document.getElementById('growthStrip');
const MIN_SIZE = 56, MAX_SIZE = 132;
ERAS.forEach((era, i) => {
  const size = MIN_SIZE + (MAX_SIZE - MIN_SIZE) * (i / (ERAS.length - 1));
  const item = document.createElement('div');
  item.className = 'growth-item';
  item.innerHTML = `<img src="${era.img}" alt="Hyderabad, ${era.year}" style="width:${size}px;"><div class="gy">${era.year}</div>`;
  item.addEventListener('click', () => snapTo(i));
  growthStrip.appendChild(item);
});

applyRotation(0);
showEra(0);

// ---------- Remote control receiver ----------
const TOPIC_BASE = 'hyd-experience-remote';
const remoteDot = document.getElementById('remoteDot');
const remoteStatusText = document.getElementById('remoteStatusText');

const remoteClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
  clientId: 'dial-' + Math.random().toString(16).slice(2)
});
remoteClient.on('connect', () => {
  remoteDot.style.background = '#3fae6a';
  remoteStatusText.textContent = 'Remote: connected · ' + TOPIC_BASE;
  remoteClient.subscribe(TOPIC_BASE + '/remote');
});
remoteClient.on('error', () => { remoteStatusText.textContent = 'Remote: connection error'; });
remoteClient.on('close', () => {
  remoteDot.style.background = '#c9583f';
  remoteStatusText.textContent = 'Remote: disconnected';
});

remoteClient.on('message', (topic, payloadBuf) => {
  let msg;
  try { msg = JSON.parse(payloadBuf.toString()); } catch (e) { return; }

  // DIAL — the natural fit for this booth: the phone's rotary knob (0-100) maps
  // directly onto the five centuries, same as turning this dial by hand
  if (msg.action === 'dial') {
    const idx = Math.min(ERAS.length - 1, Math.floor((msg.value / 100) * ERAS.length));
    snapTo(idx);
  }

  // NAVIGATE — steps one century at a time, forward or back
  if (msg.action === 'nav') {
    const dir = msg.dir === 'prev' ? -1 : 1;
    snapTo((activeIdx + dir + ERAS.length) % ERAS.length);
  }

  // SELECT — confirms whichever century is currently dialed (mostly a no-op here,
  // since the dial already shows its result live, but kept for a consistent remote)
  if (msg.action === 'select') {
    snapTo(activeIdx);
  }

  // RESET — back to the beginning, 1650
  if (msg.action === 'reset') {
    snapTo(0);
  }
});
</script>
