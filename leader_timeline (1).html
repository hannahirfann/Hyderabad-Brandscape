<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolution of Hyderabad</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.15.2/mqtt.min.js"></script>
<style>
  :root {
    --navy:#222A68; --blue:#3E6FD9; --lightblue:#6FA0F0; --yellow:#F2C94C; --cream:#FDF6E3;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--cream);
    font-family:'Josefin Sans',sans-serif;
    color: var(--navy);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:40px 20px 60px;
  }
  h1 {
    font-family:'Playfair Display',serif; font-weight:600; font-size:1.85rem;
    text-align:center; margin-bottom:8px;
  }
  .sub {
    font-size:0.8rem; font-weight:300; color: rgba(34,42,104,0.65);
    text-align:center; max-width:480px; line-height:1.6; margin-bottom:28px;
  }
  .screen-frame {
    width:100%; max-width:1100px;
    border-radius:26px; overflow:hidden;
    box-shadow: 0 30px 70px rgba(34,42,104,0.3);
    background: radial-gradient(140% 120% at 50% 0%, #24356e 0%, #131c3f 55%, #0b1130 100%);
    position:relative;
    aspect-ratio: 16/9.6;
  }

  /* dividing line running behind the button row, at true vertical center */
  .divider {
    position:absolute; left:3%; right:3%; top:62%; height:1px;
    background: rgba(111,160,240,0.22); z-index:1;
  }

  /* the button row itself, fixed at vertical center, never moves or vanishes */
  .button-strip {
    position:absolute; left:0; right:0; top:62%; transform:translateY(-50%);
    display:flex; align-items:center; justify-content:center;
    gap: 2.6vw; padding:0 3vw; z-index:6;
  }
  .era-col { position:relative; display:flex; justify-content:center; cursor:pointer; }

  .round-btn {
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #3a4a8c, #171f42 75%);
    border:2px solid rgba(111,160,240,0.4);
    box-shadow: 0 0 0 5px rgba(62,111,217,0.08), 0 6px 14px rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
    transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
  }
  .round-btn .dot {
    width:26%; height:26%; border-radius:50%;
    background: var(--yellow); box-shadow: 0 0 8px rgba(242,201,76,0.7);
  }
  .era-col:hover .round-btn { transform: translateY(-2px); }
  .era-col.active .round-btn {
    border-color: var(--yellow);
    box-shadow: 0 0 0 7px rgba(242,201,76,0.16), 0 6px 18px rgba(0,0,0,0.4);
  }

  /* everything above a button lives in this absolutely-positioned stack,
     so it grows upward without ever shifting the button row itself */
  .above-stack {
    position:absolute; bottom: calc(100% + 12px); left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:10px;
    width:max-content;
  }
  .era-label { text-align:center; line-height:1.25; }
  .era-label .yr {
    display:block; font-family:'Playfair Display',serif; font-weight:700; font-size:0.82rem; color:#fff;
  }
  .era-label .nm {
    display:block; font-size:0.52rem; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--yellow); margin-top:3px; max-width:108px;
  }
  .era-col.active .era-label .nm { color:#fff; }

  .leaders-row {
    display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
    opacity:0; transform:translateY(8px); max-height:0; overflow:hidden;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .era-col.active .leaders-row { opacity:1; transform:translateY(0); max-height:260px; overflow:visible; }
  .leader-card { display:flex; flex-direction:column; align-items:center; gap:5px; }
  .leader-avatar {
    width:168px; height:168px; border-radius:18px;
    background: #171f42;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 26px rgba(0,0,0,0.45);
  }
  .leader-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .leader-name { font-size:0.78rem; color:#fff; white-space:nowrap; }
  .leader-role {
    font-size:0.6rem; letter-spacing:0.04em; text-transform:uppercase; color: var(--yellow);
  }

  /* facts scatter below the button row, only for the active era */
  .facts-layer {
    position:absolute; left:0; right:0; top:62%; bottom:0; z-index:4;
  }
  .fact-scatter {
    position:absolute; max-width:210px;
    background: rgba(255,255,255,0.05);
    border:1px solid rgba(242,201,76,0.25);
    border-radius:12px; padding:10px 13px;
    backdrop-filter: blur(3px);
    opacity:0; transform:scale(0.95); pointer-events:none;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .fact-scatter.visible { opacity:1; transform:scale(1); pointer-events:auto; }
  .fact-scatter .yr { font-family:'Playfair Display',serif; color: var(--yellow); font-size:0.72rem; }
  .fact-scatter .tx { font-size:0.66rem; line-height:1.45; color: rgba(255,255,255,0.85); font-weight:300; margin-top:3px; }

  .idle-hint {
    position:absolute; left:0; right:0; top:80%; text-align:center;
    font-family:'Playfair Display',serif; font-style:italic; font-size:0.85rem;
    color: rgba(111,160,240,0.4); transition: opacity 0.3s ease; z-index:3;
  }
  .idle-hint.hidden { opacity:0; }

  @media (max-width: 760px) {
    .screen-frame { aspect-ratio: 9/16; }
    .button-strip { flex-wrap:wrap; gap:16px; row-gap:60px; }
    .fact-scatter { max-width:150px; padding:8px 10px; }
    .leader-avatar { width:104px; height:104px; }
  }
</style>
</head>
<body>

<h1>Evolution of Hyderabad</h1>
<div class="sub">Press an era. Its leaders rise above the button, the story scatters below.</div>
<div id="remoteStatus" style="display:flex;align-items:center;gap:6px;margin-bottom:12px;font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(34,42,104,0.45);">
  <span id="remoteDot" style="width:7px;height:7px;border-radius:50%;background:#c9583f;transition:background 0.3s ease;"></span>
  <span id="remoteStatusText">Remote: connecting…</span>
</div>

<div class="screen-frame">
  <div class="divider"></div>
  <div class="idle-hint" id="idleHint">— press an era above —</div>
  <div class="facts-layer" id="factsLayer"></div>
  <div class="button-strip" id="buttonStrip"></div>
</div>

const idleHint = document.getElementById('idleHint');
const buttonStrip = document.getElementById('buttonStrip');
const factsLayer = document.getElementById('factsLayer');

function seeded(i, salt) {
  const x = Math.sin(i * 12.9898 + salt * 78.233) * 43758.5453;
  return x - Math.floor(x);
}

// scatter slots spread evenly across the bottom half, not hugging edges
const SLOTS = [
  { top: '10%', left: '5%'  },
  { top: '18%', left: '28%' },
  { top: '10%', left: '51%' },
  { top: '18%', left: '74%' }
];

const eraCols = [];
ERAS.forEach((era, idx) => {
  const col = document.createElement('div');
  col.className = 'era-col';
  const size = 74 + seeded(idx, 1) * 20;
  const rot = (seeded(idx, 2) - 0.5) * 10;
  const dotShift = (seeded(idx, 3) - 0.5) * 8;

  const leadersHtml = era.leaders.map(l => `
    <div class="leader-card">
      <div class="leader-avatar"><img src="${l.img}" alt="${l.name}"></div>
      <div class="leader-name">${l.name}</div>
      <div class="leader-role">${l.role}</div>
    </div>`).join('');

  col.innerHTML = `
    <div class="above-stack">
      <div class="leaders-row">${leadersHtml}</div>
      <div class="era-label"><span class="yr">${era.years}</span><span class="nm">${era.name}</span></div>
    </div>
    <div class="round-btn" style="width:${size}px;height:${size}px;transform:rotate(${rot}deg);">
      <div class="dot" style="transform:translate(${dotShift}%, ${dotShift * -0.6}%)"></div>
    </div>
  `;
  col.addEventListener('click', () => showEra(idx));
  buttonStrip.appendChild(col);
  eraCols.push(col);

  // facts for this era, hidden until active
  era.facts.forEach(([yr, tx], fi) => {
    const s = SLOTS[fi % SLOTS.length];
    const cardRot = (seeded(idx * 10 + fi, 4) - 0.5) * 4;
    const card = document.createElement('div');
    card.className = `fact-scatter fact-${idx}`;
    card.style.top = s.top;
    card.style.left = s.left;
    card.style.transform = `rotate(${cardRot}deg)`;
    card.innerHTML = `<div class="yr">${yr}</div><div class="tx">${tx}</div>`;
    factsLayer.appendChild(card);
  });
});

function showEra(idx) {
  currentIdx = idx;
  idleHint.classList.add('hidden');
  eraCols.forEach((c, i) => c.classList.toggle('active', i === idx));
  document.querySelectorAll('.fact-scatter').forEach(f => {
    f.classList.toggle('visible', f.classList.contains(`fact-${idx}`));
  });
}

// ---------- Remote control receiver ----------
let currentIdx = 0;
const TOPIC_BASE = 'hyd-experience-remote';
const remoteDot = document.getElementById('remoteDot');
const remoteStatusText = document.getElementById('remoteStatusText');

const remoteClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
  clientId: 'timeline-' + Math.random().toString(16).slice(2)
});
remoteClient.on('connect', () => {
  remoteDot.style.background = '#3fae6a';
  remoteStatusText.textContent = 'Remote: connected · ' + TOPIC_BASE;
  remoteClient.subscribe(TOPIC_BASE + '/remote');
});
remoteClient.on('error', () => { remoteStatusText.textContent = 'Remote: connection error'; });
remoteClient.on('close', () => {
  remoteDot.style.background = '#c9583f';
  remoteStatusText.textContent = 'Remote: disconnected';
});

remoteClient.on('message', (topic, payloadBuf) => {
  let msg;
  try { msg = JSON.parse(payloadBuf.toString()); } catch (e) { return; }

  // NAVIGATE — cycles through the five eras, same as pressing the next button along
  if (msg.action === 'nav') {
    const dir = msg.dir === 'prev' ? -1 : 1;
    showEra((currentIdx + dir + ERAS.length) % ERAS.length);
  }

  // SELECT — opens whichever era nav last landed on (starts at the first era)
  if (msg.action === 'select') {
    showEra(currentIdx);
  }

  // DIAL — maps a 0-100 value straight onto the five eras, so turning the phone's
  // dial knob scrubs across the timeline the same way nav does
  if (msg.action === 'dial') {
    const idx = Math.min(ERAS.length - 1, Math.floor((msg.value / 100) * ERAS.length));
    showEra(idx);
  }

  // RESET — clears the active era and returns to the idle "press an era" state
  if (msg.action === 'reset') {
    eraCols.forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.fact-scatter').forEach(f => f.classList.remove('visible'));
    idleHint.classList.remove('hidden');
  }
});
</script>
